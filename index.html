<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#130f19" />
    <meta name="description" content="YOUrigin — Your Own Universe. Creative Codex. Where your ideas become something." />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="./favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <title>YOUrigin — Your Creative Codex</title>
    <script>
      // The full opening plays once per visit; reloads within the same visit skip it.
      try {
        if (sessionStorage.getItem('yourigin.splash')) document.documentElement.classList.add('splash-seen');
        sessionStorage.setItem('yourigin.splash', '1');
      } catch (e) {}
    </script>
    <style>
      /* Opening screen — inline so it shows before the app has loaded. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.4rem;
        padding: 1.5rem;
        background: radial-gradient(120% 80% at 50% 40%, #241a30 0%, #130f19 60%);
        transition: opacity 1.1s ease;
        cursor: pointer;
      }
      #splash.leaving {
        opacity: 0;
        pointer-events: none;
      }
      .splash-seen #splash {
        display: none;
      }
      #splash img {
        width: min(82vw, 600px);
        height: auto;
        opacity: 0;
        animation: splash-reveal 2.6s cubic-bezier(0.22, 0.61, 0.36, 1) 0.25s forwards;
      }
      #splash p {
        margin: 0;
        font-family: 'Cinzel Variable', 'Trajan Pro', Georgia, serif;
        font-size: clamp(10px, 2.7vw, 15px);
        letter-spacing: 0.32em;
        text-transform: uppercase;
        text-align: center;
        color: #d9b56a;
        opacity: 0;
        animation: splash-reveal 1.8s ease 2.1s forwards;
      }
      @keyframes splash-reveal {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.985);
          filter: blur(6px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img,
        #splash p {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="presentation" aria-hidden="true">
      <img src="/src/assets/brand/yourigin-logo-1400.webp" alt="" width="1400" height="513" decoding="async" fetchpriority="high" />
      <p>Your Own Universe&ensp;—&ensp;Creative Codex</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
